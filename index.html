<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucy & Sophia — La Gran Aventura</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a0a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
  }
  #gameCanvas {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="920" height="560"></canvas>
<script>
// ============================================================
// CANVAS SETUP & POLYFILLS
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const scaleX = window.innerWidth / 920;
  const scaleY = window.innerHeight / 560;
  const scale = Math.min(scaleX, scaleY);
  canvas.style.width = (920 * scale) + 'px';
  canvas.style.height = (560 * scale) + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// roundRect polyfill
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    this.beginPath();
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

// ============================================================
// WEB AUDIO
// ============================================================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, type, duration, vol) {
  vol = vol || 0.3;
  try {
    const ac = getAudioCtx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
    osc.start();
    osc.stop(ac.currentTime + duration);
  } catch(e) {}
}

function playCollect() {
  playTone(880, 'sine', 0.15, 0.25);
  setTimeout(function() { playTone(1100, 'sine', 0.15, 0.2); }, 80);
}

function playMeow() {
  try {
    const ac = getAudioCtx();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(400, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(700, ac.currentTime + 0.1);
    osc.frequency.exponentialRampToValueAtTime(300, ac.currentTime + 0.3);
    gain.gain.setValueAtTime(0.15, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.4);
    osc.start();
    osc.stop(ac.currentTime + 0.4);
  } catch(e) {}
}

function playFeed() {
  var freqs = [523, 659, 784, 1047];
  freqs.forEach(function(f, i) {
    setTimeout(function() { playTone(f, 'sine', 0.2, 0.2); }, i * 80);
  });
}

// ============================================================
// VERLET HAIR CHAIN
// ============================================================
function HairChain(segments, segLen) {
  this.segments = segments;
  this.segLen = segLen;
  this.points = [];
  this.prevPoints = [];
  for (var i = 0; i < segments; i++) {
    this.points.push({ x: 0, y: i * segLen });
    this.prevPoints.push({ x: 0, y: i * segLen });
  }
  this.anchorX = 0;
  this.anchorY = 0;
}

HairChain.prototype.update = function(ax, ay, windX) {
  this.anchorX = ax;
  this.anchorY = ay;
  var gravity = 0.35;
  var damping = 0.88;
  var i, p, pp, vx, vy;

  for (i = 1; i < this.points.length; i++) {
    p = this.points[i];
    pp = this.prevPoints[i];
    vx = (p.x - pp.x) * damping + windX * 0.5;
    vy = (p.y - pp.y) * damping + gravity;
    pp.x = p.x;
    pp.y = p.y;
    p.x += vx;
    p.y += vy;
  }

  // Constraint solving
  var iter, a, b, dx, dy, dist, diff;
  for (iter = 0; iter < 5; iter++) {
    this.points[0].x = ax;
    this.points[0].y = ay;
    for (i = 1; i < this.points.length; i++) {
      a = this.points[i - 1];
      b = this.points[i];
      dx = b.x - a.x;
      dy = b.y - a.y;
      dist = Math.sqrt(dx * dx + dy * dy) || 0.001;
      diff = (dist - this.segLen) / dist * 0.5;
      if (i > 1) {
        a.x += dx * diff;
        a.y += dy * diff;
      }
      b.x -= dx * diff;
      b.y -= dy * diff;
    }
    this.points[0].x = ax;
    this.points[0].y = ay;
  }
};

HairChain.prototype.draw = function(c) {
  var pts = this.points;
  if (pts.length < 2) return;
  var i, t, w, r, g, b;
  var r1 = 124, g1 = 58, b1 = 237;
  var r2 = 76, g2 = 29, b2 = 149;
  for (i = 0; i < pts.length - 1; i++) {
    t = i / (pts.length - 1);
    w = 13 - t * 7;
    r = Math.round(r1 + (r2 - r1) * t);
    g = Math.round(g1 + (g2 - g1) * t);
    b = Math.round(b1 + (b2 - b1) * t);
    c.beginPath();
    c.strokeStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    c.lineWidth = w;
    c.lineCap = 'round';
    c.moveTo(pts[i].x, pts[i].y);
    c.lineTo(pts[i + 1].x, pts[i + 1].y);
    c.stroke();
  }
};

// ============================================================
// PARTICLE SYSTEM
// ============================================================
var particles = [];

function Particle(x, y, type) {
  this.x = x; this.y = y;
  this.type = type;
  this.vx = (Math.random() - 0.5) * 4;
  this.vy = -Math.random() * 3 - 2;
  this.life = 1.0;
  this.decay = Math.random() * 0.02 + 0.015;
  this.size = Math.random() * 10 + 8;
  this.text = '';
  this.color = '#ff69b4';
}

function spawnHearts(x, y, count) {
  var cols = ['#ff69b4','#ff1493','#ff6eb4','#ffb6c1'];
  for (var i = 0; i < count; i++) {
    var p = new Particle(x, y, 'heart');
    p.color = cols[Math.floor(Math.random() * cols.length)];
    particles.push(p);
  }
}

function spawnScore(x, y, text) {
  var p = new Particle(x, y, 'score');
  p.text = text;
  p.vx = 0;
  p.vy = -2;
  p.decay = 0.012;
  p.color = '#ffd700';
  particles.push(p);
}

function updateParticles() {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(function(p) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    if (p.type === 'heart') {
      drawHeart(ctx, p.x, p.y, p.size, p.color);
    } else if (p.type === 'score') {
      ctx.fillStyle = p.color;
      ctx.font = 'bold 20px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.restore();
  });
}

function drawHeart(c, x, y, size, color) {
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(x, y + size * 0.3);
  c.bezierCurveTo(x, y, x - size, y, x - size, y + size * 0.3);
  c.bezierCurveTo(x - size, y + size * 0.7, x, y + size * 1.1, x, y + size * 1.1);
  c.bezierCurveTo(x, y + size * 1.1, x + size, y + size * 0.7, x + size, y + size * 0.3);
  c.bezierCurveTo(x + size, y, x, y, x, y + size * 0.3);
  c.fill();
}

// ============================================================
// STAR HELPER
// ============================================================
function drawStarSmall(c, cx, cy, r) {
  c.beginPath();
  for (var i = 0; i < 5; i++) {
    var a = (i * 4 * Math.PI / 5) - Math.PI / 2;
    var b = a + (2 * Math.PI / 5);
    if (i === 0) c.moveTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
    else c.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
    c.lineTo(cx + r * 0.4 * Math.cos(b), cy + r * 0.4 * Math.sin(b));
  }
  c.closePath();
  c.fill();
}

// ============================================================
// LUCY CHARACTER
// ============================================================
function Lucy() {
  this.x = 460;
  this.y = 420;
  this.speed = 3.5;
  this.facing = 1;
  this.walkFrame = 0;
  this.breathe = 0;
  this.isMoving = false;
  this.windX = 0;
  this.leftBraid = new HairChain(18, 12);
  this.rightBraid = new HairChain(18, 12);
}

Lucy.prototype.update = function(keys) {
  var dx = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['A'] || virtualJoystick.left) dx = -1;
  if (keys['ArrowRight'] || keys['d'] || keys['D'] || virtualJoystick.right) dx = 1;

  this.isMoving = dx !== 0;
  if (dx !== 0) {
    this.facing = dx > 0 ? 1 : -1;
    this.x += dx * this.speed;
    this.walkFrame += 0.15;
    this.windX = -dx * 1.2;
  } else {
    this.windX *= 0.85;
  }

  this.breathe += 0.05;
  // No clamp here — scene-edge detection handles transitions

  // Hair anchors: sides of head (wide spread so braids are visible)
  var headY = this.y - 100;
  this.leftBraid.update(this.x - 28, headY, this.windX);
  this.rightBraid.update(this.x + 28, headY, this.windX);
};

Lucy.prototype.draw = function(c) {
  var x = this.x;
  var y = this.y;
  var bob = Math.sin(this.breathe) * 2;
  var walkSin = Math.sin(this.walkFrame);

  // Draw hair chains BEHIND body (in world space, absolute coords)
  this.leftBraid.draw(c);
  this.rightBraid.draw(c);
  // Hair tie decorations at braid anchor points
  var hy0 = y - 100 + bob;
  c.fillStyle = '#c084fc';
  c.beginPath(); c.arc(x - 28, hy0, 7, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#fde047';
  c.beginPath(); c.arc(x + 28, hy0, 7, 0, Math.PI * 2); c.fill();

  c.save();
  c.translate(x, y + bob);
  c.scale(this.facing, 1);

  // LEGS
  var legSwing = this.isMoving ? walkSin * 14 : 0;
  // Left leg
  c.save();
  c.translate(-10, 0);
  c.rotate(legSwing * Math.PI / 180);
  c.fillStyle = '#2d2060';
  c.beginPath(); c.ellipse(0, 52, 10, 6, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#ffd700'; drawStarSmall(c, 0, 51, 4);
  c.fillStyle = '#b0b0b0'; c.fillRect(-7, 38, 14, 10);
  c.fillStyle = '#1a1040'; c.fillRect(-7, 18, 14, 24);
  c.restore();
  // Right leg
  c.save();
  c.translate(10, 0);
  c.rotate(-legSwing * Math.PI / 180);
  c.fillStyle = '#2d2060';
  c.beginPath(); c.ellipse(0, 52, 10, 6, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#ffd700'; drawStarSmall(c, 0, 51, 4);
  c.fillStyle = '#b0b0b0'; c.fillRect(-7, 38, 14, 10);
  c.fillStyle = '#1a1040'; c.fillRect(-7, 18, 14, 24);
  c.restore();

  // OVERALLS BODY
  c.fillStyle = '#1e1b4b';
  c.beginPath(); c.roundRect(-22, -40, 44, 62, 8); c.fill();
  // Straps
  c.fillStyle = '#312e81';
  c.fillRect(-18, -52, 8, 20);
  c.fillRect(10, -52, 8, 20);
  // Gold star on chest
  c.fillStyle = '#ffd700';
  drawStarSmall(c, 0, -24, 7);

  // SHIRT (purple)
  c.fillStyle = '#7c3aed';
  c.beginPath(); c.roundRect(-25, -58, 50, 24, 6); c.fill();

  // ARMS
  var armSwing = this.isMoving ? walkSin * 15 : 0;
  c.save();
  c.translate(-25, -50);
  c.rotate(-armSwing * Math.PI / 180);
  c.fillStyle = '#b5714a';
  c.beginPath(); c.roundRect(-6, 0, 12, 28, 6); c.fill();
  c.restore();
  c.save();
  c.translate(25, -50);
  c.rotate(armSwing * Math.PI / 180);
  c.fillStyle = '#b5714a';
  c.beginPath(); c.roundRect(-6, 0, 12, 28, 6); c.fill();
  c.restore();

  // NECK
  c.fillStyle = '#b5714a';
  c.fillRect(-8, -70, 16, 16);

  // HEAD
  c.fillStyle = '#b5714a';
  c.beginPath(); c.ellipse(0, -96, 32, 30, 0, 0, Math.PI * 2); c.fill();

  // HAIR top/sides
  c.fillStyle = '#7c3aed';
  c.beginPath(); c.ellipse(0, -110, 30, 16, 0, 0, Math.PI); c.fill();
  c.beginPath(); c.ellipse(-28, -102, 10, 18, -0.3, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(28, -102, 10, 18, 0.3, 0, Math.PI * 2); c.fill();

  // EYE WHITES
  c.fillStyle = '#fff';
  c.beginPath(); c.ellipse(-12, -97, 11, 13, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(12, -97, 11, 13, 0, 0, Math.PI * 2); c.fill();
  // IRIS purple
  c.fillStyle = '#7c3aed';
  c.beginPath(); c.ellipse(-12, -96, 8, 10, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(12, -96, 8, 10, 0, 0, Math.PI * 2); c.fill();
  // PUPIL
  c.fillStyle = '#1a0a2e';
  c.beginPath(); c.ellipse(-12, -96, 5, 7, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(12, -96, 5, 7, 0, 0, Math.PI * 2); c.fill();
  // Shine dots
  c.fillStyle = '#fff';
  c.beginPath(); c.ellipse(-9, -99, 2.5, 2.5, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(15, -99, 2.5, 2.5, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(-14, -101, 1.2, 1.2, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(10, -101, 1.2, 1.2, 0, 0, Math.PI * 2); c.fill();
  // Eyelashes
  c.strokeStyle = '#1a0a2e'; c.lineWidth = 1.5;
  for (var li = -2; li <= 2; li++) {
    c.beginPath(); c.moveTo(-12 + li * 3, -109); c.lineTo(-12 + li * 3.5, -113); c.stroke();
    c.beginPath(); c.moveTo(12 + li * 3, -109); c.lineTo(12 + li * 3.5, -113); c.stroke();
  }
  // Eyebrows
  c.strokeStyle = '#4c1d95'; c.lineWidth = 2.5; c.lineCap = 'round';
  c.beginPath(); c.moveTo(-20, -113); c.quadraticCurveTo(-12, -117, -4, -113); c.stroke();
  c.beginPath(); c.moveTo(4, -113); c.quadraticCurveTo(12, -117, 20, -113); c.stroke();
  // Nose
  c.fillStyle = '#9a5c36';
  c.beginPath(); c.ellipse(0, -89, 3, 2, 0, 0, Math.PI * 2); c.fill();
  // Smile
  c.strokeStyle = '#7a3a1a'; c.lineWidth = 2;
  c.beginPath(); c.arc(0, -83, 7, 0.1, Math.PI - 0.1); c.stroke();
  // Blush
  c.fillStyle = 'rgba(220,100,80,0.3)';
  c.beginPath(); c.ellipse(-20, -88, 7, 4, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(20, -88, 7, 4, 0, 0, Math.PI * 2); c.fill();

  c.restore();
};

// ============================================================
// SOPHIA — BLACK & WHITE KITTEN
// ============================================================
function Sophia() {
  this.x = 200;
  this.y = 420;
  this.happiness = 40;
  this.tailAngle = 0;
  this.tailDir = 1;
  this.blinkTimer = 0;
  this.blinking = false;
  this.meowTimer = 0;
  this.frame = 0;
}

Sophia.prototype.update = function(dt) {
  // Happiness decays 0.5 per second
  this.happiness = Math.max(0, this.happiness - 0.5 * dt / 1000);
  // Tail wag speed depends on happiness
  var wagSpeed = this.happiness >= 80 ? 0.15 : 0.06;
  this.tailAngle += this.tailDir * wagSpeed;
  if (Math.abs(this.tailAngle) > 0.6) this.tailDir *= -1;
  // Blinking
  this.blinkTimer++;
  if (this.blinkTimer > 180) {
    this.blinking = true;
    if (this.blinkTimer > 195) { this.blinking = false; this.blinkTimer = 0; }
  }
  // Meow randomly
  this.meowTimer++;
  if (this.meowTimer > 400) { this.meowTimer = 0; playMeow(); }
  this.frame++;
};

Sophia.prototype.draw = function(c) {
  var x = this.x, y = this.y;
  var bob = Math.sin(this.frame * 0.05) * 2;
  var happy = this.happiness >= 80;
  var sad = this.happiness <= 20;

  c.save();
  c.translate(x, y + bob);

  // Cushion
  c.fillStyle = '#c084fc';
  c.beginPath(); c.ellipse(0, 18, 38, 16, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#a855f7';
  c.beginPath(); c.ellipse(0, 18, 30, 10, 0, 0, Math.PI * 2); c.fill();

  // Tail
  c.save();
  c.translate(22, 5);
  c.rotate(this.tailAngle);
  c.strokeStyle = '#555'; c.lineWidth = 7; c.lineCap = 'round';
  c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(20, -15, 18, -35); c.stroke();
  c.strokeStyle = '#ccc'; c.lineWidth = 4;
  c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(20, -15, 18, -35); c.stroke();
  c.restore();

  // Body
  c.fillStyle = '#444';
  c.beginPath(); c.ellipse(0, 0, 24, 20, 0, 0, Math.PI * 2); c.fill();
  // White belly
  c.fillStyle = '#eee';
  c.beginPath(); c.ellipse(0, 4, 14, 13, 0, 0, Math.PI * 2); c.fill();
  // Black patch
  c.fillStyle = '#111';
  c.beginPath(); c.ellipse(-10, -6, 10, 8, -0.4, 0, Math.PI * 2); c.fill();

  // Head
  c.fillStyle = '#444';
  c.beginPath(); c.ellipse(0, -26, 22, 20, 0, 0, Math.PI * 2); c.fill();
  // Ears
  c.fillStyle = '#444';
  c.beginPath(); c.moveTo(-18, -38); c.lineTo(-10, -52); c.lineTo(-2, -38); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(2, -38); c.lineTo(10, -52); c.lineTo(18, -38); c.closePath(); c.fill();
  c.fillStyle = '#ffaaaa';
  c.beginPath(); c.moveTo(-15, -40); c.lineTo(-10, -48); c.lineTo(-5, -40); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(5, -40); c.lineTo(10, -48); c.lineTo(15, -40); c.closePath(); c.fill();
  // Head patch
  c.fillStyle = '#111';
  c.beginPath(); c.ellipse(-8, -30, 10, 8, -0.3, 0, Math.PI * 2); c.fill();

  // Eyes
  if (happy) {
    // Happy closed eyes
    c.strokeStyle = '#222'; c.lineWidth = 2.5;
    c.beginPath(); c.arc(-9, -27, 7, Math.PI + 0.3, Math.PI * 2 - 0.3); c.stroke();
    c.beginPath(); c.arc(9, -27, 7, Math.PI + 0.3, Math.PI * 2 - 0.3); c.stroke();
  } else if (this.blinking) {
    c.strokeStyle = '#222'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-16, -27); c.lineTo(-2, -27); c.stroke();
    c.beginPath(); c.moveTo(2, -27); c.lineTo(16, -27); c.stroke();
  } else {
    c.fillStyle = '#fff';
    c.beginPath(); c.ellipse(-9, -27, 7, 8, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(9, -27, 7, 8, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#4ade80';
    c.beginPath(); c.ellipse(-9, -27, 5, 6, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(9, -27, 5, 6, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#111';
    c.beginPath(); c.ellipse(-9, -27, 3, 5, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(9, -27, 3, 5, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.ellipse(-7, -29, 1.5, 1.5, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(11, -29, 1.5, 1.5, 0, 0, Math.PI * 2); c.fill();
    if (sad) {
      c.strokeStyle = '#555'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(-16, -37); c.lineTo(-2, -33); c.stroke();
      c.beginPath(); c.moveTo(2, -33); c.lineTo(16, -37); c.stroke();
    }
  }

  // Nose
  c.fillStyle = '#ffaaaa';
  c.beginPath(); c.moveTo(0, -20); c.lineTo(-3, -17); c.lineTo(3, -17); c.closePath(); c.fill();
  // Whiskers
  c.strokeStyle = 'rgba(255,255,255,0.8)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(3, -18); c.lineTo(22, -16); c.stroke();
  c.beginPath(); c.moveTo(3, -16); c.lineTo(22, -18); c.stroke();
  c.beginPath(); c.moveTo(-3, -18); c.lineTo(-22, -16); c.stroke();
  c.beginPath(); c.moveTo(-3, -16); c.lineTo(-22, -18); c.stroke();

function drawMamaCat(c, x, y, t) {
  var bob = Math.sin(t * 0.03) * 2;
  c.save();
  c.translate(x, y + bob);
  // Body
  c.fillStyle = '#8b6914';
  c.beginPath(); c.ellipse(0, 0, 28, 24, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#d4a855';
  c.beginPath(); c.ellipse(0, 5, 18, 16, 0, 0, Math.PI * 2); c.fill();
  // Head
  c.fillStyle = '#8b6914';
  c.beginPath(); c.ellipse(0, -30, 25, 22, 0, 0, Math.PI * 2); c.fill();
  // Ears
  c.fillStyle = '#8b6914';
  c.beginPath(); c.moveTo(-20, -44); c.lineTo(-12, -58); c.lineTo(-4, -44); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(4, -44); c.lineTo(12, -58); c.lineTo(20, -44); c.closePath(); c.fill();
  c.fillStyle = '#c49030';
  c.beginPath(); c.moveTo(-17, -46); c.lineTo(-12, -54); c.lineTo(-7, -46); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(7, -46); c.lineTo(12, -54); c.lineTo(17, -46); c.closePath(); c.fill();
  // Eyes
  c.fillStyle = '#ff9900';
  c.beginPath(); c.ellipse(-9, -30, 7, 7, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(9, -30, 7, 7, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#111';
  c.beginPath(); c.ellipse(-9, -30, 4, 5, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(9, -30, 4, 5, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#fff';
  c.beginPath(); c.ellipse(-7, -32, 2, 2, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(11, -32, 2, 2, 0, 0, Math.PI * 2); c.fill();
  // Nose
  c.fillStyle = '#ff9999';
  c.beginPath(); c.moveTo(0, -22); c.lineTo(-3, -19); c.lineTo(3, -19); c.closePath(); c.fill();
  // Whiskers
  c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(3, -20); c.lineTo(24, -18); c.stroke();
  c.beginPath(); c.moveTo(3, -18); c.lineTo(24, -20); c.stroke();
  c.beginPath(); c.moveTo(-3, -20); c.lineTo(-24, -18); c.stroke();
  c.beginPath(); c.moveTo(-3, -18); c.lineTo(-24, -20); c.stroke();
  // Tail
  c.strokeStyle = '#8b6914'; c.lineWidth = 10; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(25, 5);
  c.quadraticCurveTo(40, -10 + Math.sin(t * 0.05) * 8, 35, -25);
  c.stroke();
  c.restore();
}

var keys = {};
var virtualJoystick = { left: false, right: false };
var isMobile = navigator.maxTouchPoints > 0;
var touchId = null;
var touchStartX = 0;

window.addEventListener('keydown', function(e) {
  keys[e.key] = true;
  if (e.key === ' ') { e.preventDefault(); handleAction(); }
});
window.addEventListener('keyup', function(e) { keys[e.key] = false; });

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (gameState === 'title') { gameState = 'playing'; return; }
  for (var i = 0; i < e.changedTouches.length; i++) {
    var touch = e.changedTouches[i];
    var rect = canvas.getBoundingClientRect();
    var scaleX = 920 / rect.width;
    var scaleY = 560 / rect.height;
    var tx = (touch.clientX - rect.left) * scaleX;
    var ty = (touch.clientY - rect.top) * scaleY;
    if (tx > 750 && ty > 460) { handleAction(); return; }
    if (tx < 200 && ty > 440) { touchId = touch.identifier; touchStartX = tx; }
  }
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  for (var i = 0; i < e.changedTouches.length; i++) {
    var touch = e.changedTouches[i];
    if (touch.identifier === touchId) {
      var rect = canvas.getBoundingClientRect();
      var tx = (touch.clientX - rect.left) * (920 / rect.width);
      var dx = tx - touchStartX;
      virtualJoystick.left = dx < -20;
      virtualJoystick.right = dx > 20;
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
  e.preventDefault();
  if (gameState === 'title') { gameState = 'playing'; return; }
  for (var i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === touchId) {
      virtualJoystick.left = false;
      virtualJoystick.right = false;
      touchId = null;
    }
  }
}, { passive: false });

canvas.addEventListener('click', function() {
  if (gameState === 'title') gameState = 'playing';
});

function handleAction() {
  if (gameState !== 'playing') return;
  if (currentScene === 0 && inventory.length > 0) {
    var dist = Math.hypot(lucy.x - sophia.x, lucy.y - sophia.y);
    if (dist < 100) feedSophia();
  }
}

function feedSophia() {
  if (inventory.length === 0) return;
  var key = inventory.shift();
  var def = ITEM_DEFS[key];
  sophia.happiness = Math.min(100, sophia.happiness + def.happiness);
  score += def.score;
  spawnHearts(sophia.x, sophia.y - 60, 8);
  spawnScore(sophia.x, sophia.y - 80, '+' + def.score);
  playFeed();
  setTimeout(playMeow, 300);
}

// ============================================================
// TRANSITION
// ============================================================
function startTransition(newScene) {
  if (transitioning) return;
  transitioning = true;
  transPhase = 'fadeOut';
  transAlpha = 0;
  nextScene = newScene;
}

function updateTransition() {
  if (!transitioning) return;
  if (transPhase === 'fadeOut') {
    transAlpha += 0.07;
    if (transAlpha >= 1) {
      transAlpha = 1;
      currentScene = nextScene;
      sceneNameTimer = 120;
      transPhase = 'fadeIn';
    }
  } else {
    transAlpha -= 0.07;
    if (transAlpha <= 0) {
      transAlpha = 0;
      transitioning = false;
    }
  }
}

function drawAwning(c, x, y, color) {
  var width = 220, stripes = 6;
  for (var i = 0; i < stripes; i++) {
    var sx = x + (i / stripes) * width;
    c.fillStyle = i % 2 === 0 ? color : '#fff';
    c.beginPath();
    c.moveTo(sx, y - 30); c.lineTo(sx + width / stripes, y - 30);
    c.lineTo(sx + width / stripes + 15, y + 20); c.lineTo(sx + 15, y + 20);
    c.closePath(); c.fill();
  }
  c.fillStyle = '#374151';
  c.fillRect(x + 10, y + 20, 8, 200);
  c.fillRect(x + width - 18, y + 20, 8, 200);
}

function drawSceneItems(sceneIdx, t) {

    var def = ITEM_DEFS[item.key];

    ctx.beginPath(); ctx.ellipse(item.x, item.y - 20, glow + 10, glow + 10, 0, 0, Math.PI * 2); ctx.fill();

// ============================================================
// UPDATE & DRAW
// ============================================================
function update(dt) {
  if (gameState !== 'playing') return;
  globalTime++;
  sophia.update(dt);
  updateParticles();
  updateTransition();
  if (transitioning) return;

  lucy.update(keys);

  // Scene edge detection — fire before any clamp
  if (lucy.x > 860 && currentScene < 5) {
    startTransition(currentScene + 1);
    lucy.x = 80;
  } else if (lucy.x < 60 && currentScene > 0) {
    startTransition(currentScene - 1);
    lucy.x = 840;
  } else {
    // Soft clamp only when not at an edge
    if (lucy.x < 0)   lucy.x = 0;
    if (lucy.x > 920) lucy.x = 920;
  }

  if (sceneNameTimer > 0) sceneNameTimer--;

  // Item collection
  tooltip = '';
  if (currentScene > 0) {
    var sceneList = SCENE_ITEMS[currentScene];
    if (sceneList) {
      sceneList.forEach(function(item) {
        if (collectedItems[item.key]) return;
        var dist = Math.hypot(lucy.x - item.x, lucy.y - item.y);
        if (dist < 40) {
          collectedItems[item.key] = true;
          if (inventory.length < 5) inventory.push(item.key);
          playCollect();
          spawnScore(item.x, item.y - 30, '¡Recogido!');
          // Respawn after 30 seconds
          (function(k) {
            setTimeout(function() { collectedItems[k] = false; }, 30000);
          })(item.key);
        } else if (dist < 80) {
          tooltip = '⭐ Recoger ' + ITEM_DEFS[item.key].emoji;
        }
      });
    }
  }

  // Feed prompt at home
  if (currentScene === 0 && inventory.length > 0) {
    var distS = Math.hypot(lucy.x - sophia.x, lucy.y - sophia.y);
    if (distS < 100) tooltip = '🐾 ESPACIO — Dar comida a Sophia';
  }
  // Home hint when inventory empty
  if (currentScene === 0 && inventory.length === 0 && globalTime < 300) {
    tooltip = '→ ¡Camina a la derecha para buscar comida!';
  }

  // Happy hearts ambient
  if (sophia.happiness >= 80 && globalTime % 60 === 0) {
    spawnHearts(sophia.x, sophia.y - 60, 3);
  }
}

function draw() {
  ctx.clearRect(0, 0, 920, 560);

  if (gameState === 'title') { drawTitleScreen(); return; }

  // Background scene
  switch (currentScene) {
    case 0: drawScene0(globalTime); break;
    case 1: drawScene1(globalTime); break;
    case 2: drawScene2(globalTime); break;
    case 3: drawScene3(globalTime); break;
    case 4: drawScene4(globalTime); break;
    case 5: drawScene5(globalTime); break;
  }

  // Scene collectibles
  if (currentScene > 0) drawSceneItems(currentScene, globalTime);

  // Exit arrows — guide player to leave the scene
  drawExitArrows();

  // Sophia at home
  if (currentScene === 0) sophia.draw(ctx);

  // Lucy
  lucy.draw(ctx);

  // Particles
  drawParticles();

  // UI
  drawUI();

  // Transition overlay
  if (transitioning || transAlpha > 0) {
    ctx.fillStyle = 'rgba(15,10,40,' + transAlpha + ')';
    ctx.fillRect(0, 0, 920, 560);
  }
}

// ============================================================
// GAME LOOP
// ============================================================
var lastTime = 0;

function gameLoop(ts) {
  var dt = Math.min(ts - lastTime, 50);
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

// Initialize hair chains with outward arc so braids are visible from the start
(function() {
  var startX = lucy.x, startY = lucy.y - 100;
  for (var i = 0; i < lucy.leftBraid.points.length; i++) {
    // Arc outward then downward: first half goes left, second half hangs down
    var t = i / (lucy.leftBraid.points.length - 1);
    var angle = t * Math.PI * 0.55; // 0 = horizontal left, π/2 = vertical down
    lucy.leftBraid.points[i].x = startX - 28 - Math.cos(angle) * i * 9;
    lucy.leftBraid.points[i].y = startY + Math.sin(angle) * i * 9;
    lucy.leftBraid.prevPoints[i].x = lucy.leftBraid.points[i].x;
    lucy.leftBraid.prevPoints[i].y = lucy.leftBraid.points[i].y;
  }
  for (var j = 0; j < lucy.rightBraid.points.length; j++) {
    var t2 = j / (lucy.rightBraid.points.length - 1);
    var angle2 = t2 * Math.PI * 0.55;
    lucy.rightBraid.points[j].x = startX + 28 + Math.cos(angle2) * j * 9;
    lucy.rightBraid.points[j].y = startY + Math.sin(angle2) * j * 9;
    lucy.rightBraid.prevPoints[j].x = lucy.rightBraid.points[j].x;
    lucy.rightBraid.prevPoints[j].y = lucy.rightBraid.points[j].y;
  }
})();

requestAnimationFrame(function(ts) {
  lastTime = ts;
  requestAnimationFrame(gameLoop);
});
</script>
